# Hummingbird's legacy-rechunker helper ends by running tmpfiles over the
# immutable deployment root. bootc keeps / read-only, so that final pass fails
# on root.conf's chmod of /. The earlier sysusers/rechunker steps are retained.
#
# The stock unit also orders itself both After=local-fs.target and
# Before=systemd-sysusers.service, which cannot both hold: local-fs already
# comes after sysusers, through systemd-tmpfiles-setup-dev.service and
# local-fs-pre.target. systemd finds the cycle and breaks it by deleting a job
# from it -- systemd-tmpfiles-setup-dev.service, the unit that creates the
# static device nodes:
#
#   local-fs-pre.target: Found ordering cycle: systemd-tmpfiles-setup-dev
#     after systemd-sysusers after rechunker-group-fix after local-fs.target
#     after local-fs-pre.target - after systemd-tmpfiles-setup-dev
#   Job systemd-tmpfiles-setup-dev.service/start deleted to break ordering cycle
#
# The installed system then has no device nodes to speak of, every .device unit
# times out at once -- /dev/ttyS0 as readily as the /boot filesystem, so it is
# not a disk fault -- boot.mount fails on a partition that is perfectly intact,
# and the boot ends in an emergency shell. That is the "black screens and
# systems will NOT boot" the stock unit's own header warns about.
#
# Drop the local-fs ordering and keep the half that matters: this has to run
# before systemd-sysusers.service, and it needs a writable /etc, which
# systemd-remount-fs.service provides well before local-fs.target.
[Unit]
After=
Wants=
After=systemd-remount-fs.service
After=bootc-sysusers-shadow-sync.service
Before=systemd-sysusers.service

[Service]
ExecStart=
ExecStart=bash -c 'touch /etc/gshadow && chmod 600 /etc/gshadow'
ExecStart=bash -c 'rm /etc/gshadow'
ExecStart=systemd-sysusers
ExecStart=rechunker-group-fix
