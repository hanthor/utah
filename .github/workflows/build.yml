name: Build Utah

on:
  pull_request:
  push:
    branches: [testing]
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: utah-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, network-only gate. A contract package with no Rawhide source used to
  # surface as an opaque `exit status 71` from the image build; catching it here
  # costs seconds instead of the full matrix.
  contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install zstandard
        run: pip install --quiet zstandard
      - name: Validate manifests
        run: just check
      - name: Check Bluefin parity
        run: just check-parity
      - name: Check Rawhide package availability
        run: just check-rawhide

  build:
    needs: contract
    uses: projectbluefin/actions/.github/workflows/reusable-build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write
    with:
      brand_name: utah
      image_flavors: '["main", "nvidia", "gaming", "nvidia-gaming"]'
      stream_name: testing
      architecture: '["x86_64"]'
      # Testing is advanced only after post-testing-e2e validates the build.
      publish_stream_tag: "false"
