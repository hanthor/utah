name: Build Utah

on:
  pull_request:
  push:
    branches: [testing]
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: utah-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, network-only gate. A contract package with no Rawhide source used to
  # surface as an opaque `exit status 71` from the image build; catching it here
  # costs seconds instead of the full matrix.
  contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install zstandard
        run: pip install --quiet zstandard
      - name: Validate manifests
        run: just check
      - name: Check Bluefin parity
        run: just check-parity
      - name: Check package availability in Utah's repositories
        run: just check-repos

  # The OGC kernel compile and the NVIDIA module build depend only on the base
  # image and on the two scripts that perform them, so they are hoisted out of
  # the image build into an image of their own, tagged with a hash of exactly
  # those inputs. When the tag already exists this job is a registry lookup and
  # the three flavors that need it skip roughly half an hour of compiling each.
  kernel-cache:
    needs: contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build the kernel cache image if it is not published yet
        env:
          REPO_ORGANIZATION: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${REPO_ORGANIZATION,,}/utah-kernel-cache:$(./scripts/kernel-cache-tag.sh)"
          if podman pull -q "$ref" >/dev/null 2>&1; then
            echo "Cache hit: $ref is already published"
            exit 0
          fi
          echo "Cache miss: building $ref"
          podman build --tag "$ref" --file Containerfile.kernel .
          podman push "$ref"

  build:
    needs: [contract, kernel-cache]
    uses: projectbluefin/actions/.github/workflows/reusable-build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write
    with:
      brand_name: utah
      image_flavors: '["main", "nvidia", "gaming", "nvidia-gaming"]'
      stream_name: testing
      architecture: '["x86_64"]'
      # Testing is advanced only after post-testing-e2e validates the build.
      publish_stream_tag: "false"
