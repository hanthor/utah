name: Promote testing to main

on:
  push:
    branches: [testing]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read
  actions: read
  statuses: write

jobs:
  promote:
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@v1
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      variants: >-
        [{"image":"utah"},{"image":"utah-nvidia"},{"image":"utah-gaming"},{"image":"utah-nvidia-gaming"}]
      cosign_identity_regexp: >-
        ^https://github\.com/hanthor/utah/\.github/workflows/build\.yml@refs/heads/testing$
      run_e2e: false
    secrets: inherit
