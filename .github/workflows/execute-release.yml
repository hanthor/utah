name: Execute stable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      is-promotion: ${{ steps.check.outputs.is-promotion }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$EVENT" == workflow_dispatch || "$MESSAGE" =~ ^chore:\ promote\ testing\ to\ main ]]; then echo 'is-promotion=true' >> "$GITHUB_OUTPUT"; fi
  execute:
    needs: check-trigger
    if: needs.check-trigger.outputs.is-promotion == 'true'
    uses: projectbluefin/actions/.github/workflows/reusable-execute-release.yml@v1
    permissions:
      actions: read
      contents: write
      issues: write
      packages: write
      pull-requests: write
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      variants: >-
        [{"image":"utah","source_tag":"testing","target_tag":"stable"},{"image":"utah-nvidia","source_tag":"testing","target_tag":"stable"},{"image":"utah-gaming","source_tag":"testing","target_tag":"stable"},{"image":"utah-nvidia-gaming","source_tag":"testing","target_tag":"stable"}]
      cosign_identity_regexp: ^https://github\.com/hanthor/utah/\.github/workflows/build\.yml@refs/heads/testing$
      fast_forward_sha: ${{ github.sha }}
      run_release_gate: true
      gate_suites: smoke,common
    secrets: inherit
